<style>
/* ── NAV (floating pill — same as index.html) ── */
nav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  background: transparent;
  padding-top: 16px;
  display: flex !important; justify-content: center;
  pointer-events: none;
  height: auto !important;
}
.nav-inner {
  display: flex !important; align-items: center;
  background: rgba(18,18,18,0.90) !important;
  backdrop-filter: blur(16px) !important;
  -webkit-backdrop-filter: blur(16px) !important;
  border: 1px solid rgba(255,255,255,0.12) !important;
  border-radius: 50px !important;
  padding: 10px 14px 10px 28px !important;
  gap: 0;
  width: fit-content;
  min-width: 780px;
  max-width: calc(100vw - 48px);
  pointer-events: all;
  height: auto !important;
  justify-content: flex-start !important;
}
nav .logo {
  display: flex; align-items: center; gap: 4px;
  text-decoration: none; white-space: nowrap;
  font-weight: inherit; font-size: inherit; letter-spacing: inherit;
}
.nav-links {
  display: flex !important; gap: 36px; align-items: center;
  padding: 0; margin-left: 56px;
}
.nav-link {
  color: rgba(255,255,255,0.55) !important; font-size: 14px;
  text-decoration: none; transition: color .2s; white-space: nowrap; font-weight: 500;
}
.nav-link:hover { color: rgba(255,255,255,0.90) !important; }
.nav-right { display: flex; align-items: center; gap: 16px; margin-left: 56px; }

/* Language switcher */
.lang-switcher { position: relative; }
.lang-btn {
  display: flex; align-items: center; gap: 6px;
  padding: 6px 10px; border-radius: 20px;
  border: none; background: transparent;
  cursor: pointer; user-select: none; transition: background .2s;
}
.lang-btn:hover { background: rgba(255,255,255,0.08); }
.lang-flag {
  width: 22px !important; height: 22px !important; border-radius: 50% !important;
  overflow: hidden; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  background: transparent !important; border: none !important;
}
.lang-code { font-size: 14px; font-weight: 500; color: #d4d4d4; letter-spacing: .04em; }
.lang-chevron { color: #a3a3a3; transition: transform .25s; display: flex; align-items: center; }
.lang-switcher.open .lang-chevron { transform: rotate(180deg); }
.lang-dropdown {
  position: absolute; top: calc(100% + 10px); right: 0;
  background: #1a1a1a; border: 1px solid rgba(255,255,255,0.1);
  border-radius: 14px; overflow: hidden; min-width: 140px;
  box-shadow: 0 16px 40px rgba(0,0,0,0.5);
  opacity: 0; transform: translateY(-8px) scale(.97);
  pointer-events: none;
  transition: opacity .22s cubic-bezier(.16,1,.3,1), transform .22s cubic-bezier(.16,1,.3,1);
  z-index: 200;
}
.lang-switcher.open .lang-dropdown {
  opacity: 1; transform: translateY(0) scale(1); pointer-events: all;
}
.lang-option {
  display: flex; align-items: center; gap: 10px;
  padding: 12px 16px; cursor: pointer;
  font-size: 14px; font-weight: 500; color: #d4d4d4; transition: background .15s;
}
.lang-option:hover { background: rgba(255,255,255,0.07); }
.lang-option.active { color: #3b82f6; }
.lang-option.active .lang-opt-code::after { content: ' ✓'; }
.lang-opt-flag {
  width: 22px; height: 22px; border-radius: 50%;
  overflow: hidden; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
}
.lang-divider { height: 1px; background: rgba(255,255,255,0.07); margin: 0 12px; }

/* Nav CTA button */
nav .btn-primary {
  display: inline-flex !important; align-items: center; justify-content: center;
  background: linear-gradient(135deg, #2563eb, #3b82f6) !important;
  color: #fff !important;
  padding: 12px 24px !important; border-radius: 9999px !important;
  font-size: 14px !important; font-weight: 600 !important; line-height: 1;
  min-height: 44px !important; height: auto !important;
  text-decoration: none; border: none !important; cursor: pointer;
  box-shadow: 0 0 20px rgba(37,99,235,0.25) !important;
  transition: opacity .2s, transform .15s, box-shadow .2s;
  white-space: nowrap; letter-spacing: normal;
}
nav .btn-primary:hover {
  opacity: 0.9; transform: translateY(-2px) !important;
  box-shadow: 0 4px 24px rgba(37,99,235,0.4) !important;
}

/* Hamburger */
.hamburger-btn {
  display: none; align-items: center; justify-content: center;
  width: 40px; height: 40px; border-radius: 9999px;
  border: 1px solid rgba(255,255,255,0.12);
  background: transparent; cursor: pointer;
  flex-direction: column; gap: 4.5px;
}
.hamburger-btn:hover { background: rgba(255,255,255,0.1); }
.hamburger-bar {
  width: 16px; height: 1.5px; background: #fff; border-radius: 2px;
  transition: transform .25s cubic-bezier(.16,1,.3,1), opacity .2s, transform .25s;
}
.hamburger-btn.open .hamburger-bar:nth-child(1) { transform: translateY(6px) rotate(45deg); }
.hamburger-btn.open .hamburger-bar:nth-child(2) { opacity: 0; transform: scaleX(0); }
.hamburger-btn.open .hamburger-bar:nth-child(3) { transform: translateY(-6px) rotate(-45deg); }

/* Mobile menu */
.mobile-menu-overlay {
  position: fixed; inset: 0; z-index: 150;
  background: rgba(0,0,0,0.5);
  opacity: 0; pointer-events: none; transition: opacity .3s;
}
.mobile-menu-overlay.open { opacity: 1; pointer-events: all; }
.mobile-menu {
  position: fixed; top: 0; right: -100%; z-index: 160;
  width: min(360px, 85vw); height: 100%;
  background: #0f0f0f; border-left: 1px solid rgba(255,255,255,0.08);
  display: none; flex-direction: column; padding: 24px;
  transition: right .35s cubic-bezier(.16,1,.3,1);
}
.mobile-menu.open { right: 0; }
.menu-top {
  display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px;
}
.mob-overlay-logo { display: flex; align-items: center; }
.mobile-menu-close {
  width: 36px; height: 36px; border-radius: 50%;
  border: 1px solid rgba(255,255,255,0.12); background: transparent;
  color: #fff; font-size: 16px; display: flex; align-items: center; justify-content: center;
  cursor: pointer;
}
.mobile-menu-close:hover { background: rgba(255,255,255,0.1); }
.menu-center { display: flex; flex-direction: column; gap: 4px; flex: 1; }
.mobile-menu-link {
  font-size: 20px; font-weight: 500; color: rgba(255,255,255,0.65);
  padding: 14px 0; border-bottom: 1px solid rgba(255,255,255,0.06);
  text-decoration: none;
  opacity: 0; transform: translateX(20px);
  transition: color .2s, opacity .3s, transform .3s;
}
.mobile-menu-link:hover { color: #fff; }
.mobile-menu.open .menu-center .mobile-menu-link:nth-child(1) { opacity:1; transform:none; transition-delay:.09s; }
.mobile-menu.open .menu-center .mobile-menu-link:nth-child(2) { opacity:1; transform:none; transition-delay:.14s; }
.mobile-menu.open .menu-center .mobile-menu-link:nth-child(3) { opacity:1; transform:none; transition-delay:.19s; }
.menu-bottom { padding-top: 24px; }
.mobile-menu-cta {
  display: block; width: 100%; text-align: center;
  padding: 16px; border-radius: 9999px;
  background: linear-gradient(135deg, #2563eb, #3b82f6);
  color: #fff; font-weight: 600; font-size: 15px;
  text-decoration: none;
  opacity: 0; transform: translateY(12px);
  transition: opacity .3s .31s, transform .3s .31s;
}
.mobile-menu.open .mobile-menu-cta { opacity: 1; transform: none; }
.mobile-menu-cta:hover { opacity: .88; }

@media (max-width: 768px) {
  .hamburger-btn { display: flex !important; }
  .mobile-menu { display: flex; }
  .nav-links { display: none !important; }
  nav .btn-primary { display: none !important; }
  .nav-inner { min-width: unset !important; padding: 8px 8px 8px 16px !important; }
}

/* ── FOOTER (main site style) ── */
footer.footer-section {

.footer-ctas { display: flex; gap: 8px; }
footer.footer-section .btn-primary {
  display: inline-flex; align-items: center; justify-content: center;
  background: linear-gradient(135deg, #2563eb, #3b82f6) !important;
  color: #fff !important;
  padding: 14px 28px; border-radius: 9999px;
  font-size: 15px; font-weight: 600; line-height: 1;
  min-height: 48px; height: auto;
  text-decoration: none; border: none; cursor: pointer;
  box-shadow: 0 0 20px rgba(37,99,235,0.25);
  transition: opacity .2s, transform .15s, box-shadow .2s;
  white-space: nowrap;
}
footer.footer-section .btn-primary:hover {
  opacity: 0.9; transform: translateY(-2px);
  box-shadow: 0 4px 24px rgba(37,99,235,0.4);
}
.footer-mid {
  display: flex !important; align-items: center !important;
  justify-content: space-between !important; padding: 0 0 40px !important;
}
.footer-socials { display: flex !important; gap: 12px !important; }
.footer-social { color: #fff; text-decoration: none; transition: color .2s; }
.footer-social:hover { color: #2563eb; }
.footer-bottom {
  border-top: 1px solid rgba(38,38,38,.6) !important;
  padding: 24px 0 32px !important;
  display: flex !important; align-items: center !important;
  justify-content: space-between !important;
}
.footer-copy { font-size: 16px; color: #737373; }
.footer-legal { display: flex; gap: 24px; }
.footer-legal a { font-size: 16px; color: #737373; text-decoration: none; transition: color .2s; }
.footer-legal a:hover { color: #fff; }

/* Container for footer (avoids conflict with case study's .shell) */
.main-container {
  max-width: 1440px; margin: 0 auto; padding: 0 80px; width: 100%;
}

/* Reveal animations for footer */
.reveal { opacity: 0; transform: translateY(28px); transition: opacity .7s cubic-bezier(.16,1,.3,1), transform .7s cubic-bezier(.16,1,.3,1); }
.reveal.visible { opacity: 1 !important; transform: translateY(0) !important; }

/* Hero: ensure padding-top clears the floating nav */
.hero { padding-top: 120px !important; }

@media (max-width: 1200px) { .main-container { padding: 0 48px; } }
@media (max-width: 900px) {
  .footer-top { flex-direction: column; align-items: flex-start !important; gap: 28px; }
  .footer-mid { flex-direction: column !important; gap: 20px; }
  .footer-bottom { flex-direction: column !important; gap: 12px; align-items: flex-start !important; }
}
@media (max-width: 480px) { .main-container { padding: 0 20px; } footer.footer-section { padding-top: 56px; } }

function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  const setTweak = React.useCallback((key, val) => {
    setValues((prev) => ({ ...prev, [key]: val }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits: { [key]: val } }, '*');
  }, []);
  return { values, set: setTweak };
}

function TweaksPanel({ title = 'Tweaks', children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel"
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">{children}</div>
      </div>
    </>
  );
}

function TweakSection({ title, children }) {
  return (
    <>
      <div className="twk-sect">{title}</div>
      {children}
    </>
  );
}

function TweakRow({ label, value, children, inline = false }) {
  return (
    <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
      <div className="twk-lbl">
        <span>{label}</span>
        {value != null && <span className="twk-val">{value}</span>}
      </div>
      {children}
    </div>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;
  const valueRef = React.useRef(value);
  valueRef.current = value;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

<!-- ════ PLAIN JS: nav, lang switcher, reveal ════ -->
<script>
// ── Hamburger / Mobile menu ──
const hamburgerBtn      = document.getElementById('hamburgerBtn');
const mobileMenu        = document.getElementById('mobileMenu');
const mobileClose       = document.getElementById('mobileMenuClose');
const mobileMenuOverlay = document.getElementById('mobileMenuOverlay');

function openMobileMenu() {
  mobileMenu.classList.add('open');
  mobileMenuOverlay.classList.add('open');
  hamburgerBtn.classList.add('open');
  hamburgerBtn.setAttribute('aria-expanded', 'true');
  document.body.style.overflow = 'hidden';
}
function closeMobileMenu() {
  mobileMenu.classList.remove('open');
  mobileMenuOverlay.classList.remove('open');
  hamburgerBtn.classList.remove('open');
  hamburgerBtn.setAttribute('aria-expanded', 'false');
  document.body.style.overflow = '';
}
if (hamburgerBtn) hamburgerBtn.addEventListener('click', () => {
  mobileMenu.classList.contains('open') ? closeMobileMenu() : openMobileMenu();
});
if (mobileClose) mobileClose.addEventListener('click', closeMobileMenu);
if (mobileMenuOverlay) mobileMenuOverlay.addEventListener('click', closeMobileMenu);
document.querySelectorAll('.mobile-menu-link, .mobile-menu-cta').forEach(el => {
  el.addEventListener('click', closeMobileMenu);
});

// ── Language switcher ──
const _translations = {
  en: { flagSrc: 'https://flagcdn.com/w40/gb.png', code: 'EN' },
  fr: { flagSrc: 'https://flagcdn.com/w40/fr.png', code: 'FR' },
  ar: { flagSrc: 'https://flagcdn.com/w40/sa.png', code: 'AR' },
};

function toggleLang() {
  document.getElementById('langSwitcher').classList.toggle('open');
}
document.addEventListener('click', (e) => {
  const sw = document.getElementById('langSwitcher');
  if (sw && !sw.contains(e.target)) sw.classList.remove('open');
});

function setLang(lang) {
  localStorage.setItem('ls_lang', lang);
  document.getElementById('activeFlagImg').src = _translations[lang].flagSrc;
  document.getElementById('activeLangCode').textContent = _translations[lang].code;
  document.getElementById('opt-en').classList.toggle('active', lang === 'en');
  document.getElementById('opt-fr').classList.toggle('active', lang === 'fr');
  document.getElementById('opt-ar').classList.toggle('active', lang === 'ar');
  document.getElementById('langSwitcher').classList.remove('open');
  document.querySelectorAll('[data-en]').forEach(el => {
    const val = el.getAttribute('data-' + lang);
    if (val === null) return;
    if (val.includes('<')) el.innerHTML = val;
    else if (el.children.length === 0) el.textContent = val;
    else el.innerHTML = val;
  });
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
}

// ── Reveal animations (footer only) ──
const revealEls = document.querySelectorAll('.reveal');
const revealObs = new IntersectionObserver(entries => {
  entries.forEach(e => {
    if (e.isIntersecting) { e.target.classList.add('visible'); revealObs.unobserve(e.target); }
  });
}, { threshold: 0.05 });
revealEls.forEach(el => revealObs.observe(el));
setTimeout(() => {
  document.querySelectorAll('.reveal:not(.visible)').forEach(el => el.classList.add('visible'));
}, 2500);

// ── Init language from localStorage ──
(function() {
  const saved = localStorage.getItem('ls_lang') || 'en';
  setLang(saved);
})();
</script>
</body>
